<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>laurins</title>
  <link rel="icon" type="image/png" href="world/star.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #000;
      font-family: "Courier New", Courier, monospace;
    }

    #scene-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity 450ms ease;
      background: #000;
    }

    #mini-game {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 6;
      transition: opacity 240ms ease;
      background: #fff;
    }

    #mini-game.is-fading {
      opacity: 0;
      pointer-events: none;
    }

    .paper {
      width: min(860px, calc(100vw - 42px));
      text-align: center;
      padding: 22px 18px;
    }

    #loading-gate {
      min-height: 220px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 10px;
    }

    #loading-gate.is-hidden {
      display: none;
    }

    .charging-title {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Punts animats només amb CSS (opacitat): continuen movent-se encara que
       el navegador estigui ocupat construint l'escena. */
    #charging-points {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.3em;
    }

    #charging-points span {
      display: inline-block;
      opacity: 0.15;
      animation: charging-dot 1.4s ease-in-out infinite;
      will-change: opacity;
    }

    #charging-points span:nth-child(2) { animation-delay: 0.2s; }
    #charging-points span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes charging-dot {
      0%, 100% { opacity: 0.15; }
      40% { opacity: 1; }
    }

    .question {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    .question-wrap.is-hidden {
      display: none;
    }

    /* Zona on es pot moure el botó: més ample que el text i més alta. */
    .button-area {
      position: relative;
      left: 50%;
      width: min(1000px, 90vw);
      height: min(420px, 52vh);
      margin-top: 28px;
      transform: translateX(-50%);
    }

    .btn {
      position: absolute;
      border: 2px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 10px 24px;
      cursor: pointer;
      user-select: none;
      transition: transform 70ms ease, background 120ms ease;
    }

    .btn:hover {
      background: #f0f0f0;
    }

    .btn:active {
      transform: translateY(1px);
      background: #e8e8e8;
    }

    #yes-btn {
      left: 38%;
      top: 120px;
      transform: translateX(-50%);
    }

    #no-btn {
      left: 62%;
      top: 120px;
      transform: translateX(-50%);
    }

    #message {
      margin: 20px auto 0;
      min-height: 52px;
      max-width: 720px;
      font-size: 1rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #fade-layer {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 700ms ease;
      z-index: 7;
    }

    #fade-layer.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Botó per apagar o encendre el so. */
    #sound-toggle {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 20;
      display: none;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(230, 220, 200, 0.55);
      font-size: 15px;
      cursor: pointer;
    }

    #sound-toggle.is-muted {
      text-decoration: line-through;
      opacity: 0.5;
    }

    /* Indicador de versió (temporal, per saber què està publicat). */
    #version-tag {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 20;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="scene-frame" title="escena"></iframe>

  <main id="mini-game">
    <section class="paper">
      <div id="loading-gate" aria-live="polite">
        <p class="charging-title">carregant records</p>
        <p id="charging-points" aria-hidden="true"><span>.</span><span>.</span><span>.</span></p>
      </div>
      <div id="question-wrap" class="question-wrap is-hidden">
        <h1 class="question">qui estima més a l'altre?</h1>
        <div class="button-area" id="button-area">
          <button id="yes-btn" class="btn" type="button">MARTÍ</button>
          <button id="no-btn" class="btn" type="button">LAURA</button>
        </div>
      </div>
      <p id="message"></p>
    </section>
  </main>

  <div id="fade-layer"></div>
  <button id="sound-toggle" type="button" aria-label="So" title="So">♪</button>

  <script type="module">
    import { startAmbient, unlockAudio, toggleMute } from "./audio/ambient.js";
    window.startAmbient = startAmbient;
    // Qualsevol clic prepara l'àudio (sense sonar): així no falla en començar.
    document.addEventListener("pointerdown", unlockAudio);
    const btn = document.getElementById("sound-toggle");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      btn.classList.toggle("is-muted", toggleMute());
    });
  </script>
  <script>
    // ===== Versió (temporal) =====
    // version.json es llegeix sense memòria cau: és el que hi ha publicat ara mateix.
    // L'escena també diu la seva versió; si no coincideixen, el navegador té codi vell.
    (function () {
      const tag = document.getElementById("version-tag");
      let published = "?";
      let sceneVersion = null;

      function render() {
        let text = `versió ${published}`;
        if (sceneVersion && sceneVersion !== published) {
          text += ` · escena ${sceneVersion} (codi antic: refresca amb Ctrl+Shift+R)`;
        }
        tag.textContent = text;
      }

      fetch(`version.json?t=${Date.now()}`, { cache: "no-store" })
        .then((r) => r.json())
        .then((data) => { published = data.version; render(); })
        .catch(() => render());

      window.addEventListener("message", (event) => {
        if (event.data && event.data.sceneVersion) {
          sceneVersion = event.data.sceneVersion;
          render();
        }
      });
    })();
  </script>
  <script>
    const sceneFrame = document.getElementById("scene-frame");
    const miniGame = document.getElementById("mini-game");
    const buttonArea = document.getElementById("button-area");
    const yesBtn = document.getElementById("yes-btn");
    const noBtn = document.getElementById("no-btn");
    const loadingGate = document.getElementById("loading-gate");
    const questionWrap = document.getElementById("question-wrap");
    const chargingPoints = document.getElementById("charging-points");
    const message = document.getElementById("message");
    const fadeLayer = document.getElementById("fade-layer");

    let attemptedNo = false;
    let transitioning = false;
    let typingTimer = null;
    let chargingTimer = null;
    let worldLoaded = false;
    let questionReady = false;
    let noTargetX = null;
    let noTargetY = null;
    let noCurrentX = null;
    let noCurrentY = null;

    // Llocs on pot fugir el botó (graella 4×4 per tota la zona).
    const NO_POSITIONS = [
      { x: 0.06, y: 0.06 },
      { x: 0.36, y: 0.06 },
      { x: 0.64, y: 0.06 },
      { x: 0.94, y: 0.06 },
      { x: 0.06, y: 0.36 },
      { x: 0.36, y: 0.36 },
      { x: 0.64, y: 0.36 },
      { x: 0.94, y: 0.36 },
      { x: 0.06, y: 0.64 },
      { x: 0.36, y: 0.64 },
      { x: 0.64, y: 0.64 },
      { x: 0.94, y: 0.64 },
      { x: 0.06, y: 0.94 },
      { x: 0.36, y: 0.94 },
      { x: 0.64, y: 0.94 },
      { x: 0.94, y: 0.94 }
    ];

    function typeText(text) {
      if (typingTimer) {
        clearInterval(typingTimer);
      }

      message.textContent = "";
      let i = 0;

      typingTimer = setInterval(() => {
        message.textContent += text[i] || "";
        i += 1;

        if (i >= text.length) {
          clearInterval(typingTimer);
          typingTimer = null;
        }
      }, 20);
    }

    function showNoHint() {
      typeText("va, fes-te la difícil");
    }

    function startChargingPoints() {
      return; // ara els punts s'animen amb CSS
      const frames = [".", "..", "...", "...."];
      let index = 0;
      chargingPoints.textContent = frames[0];

      chargingTimer = setInterval(() => {
        index = (index + 1) % frames.length;
        chargingPoints.textContent = frames[index];
      }, 250);
    }

    function stopChargingPoints() {
      if (chargingTimer) {
        clearInterval(chargingTimer);
        chargingTimer = null;
      }
    }

    function revealQuestion() {
      if (questionReady) return;
      questionReady = true;
      stopChargingPoints();
      loadingGate.classList.add("is-hidden");
      questionWrap.classList.remove("is-hidden");
    }

    function moveNoButtonAggressively(pointerX, pointerY) {
      const areaRect = buttonArea.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      const margin = 10;
      const minX = margin;
      const minY = margin;
      const maxX = areaRect.width - noRect.width - margin;
      const maxY = areaRect.height - noRect.height - margin;

      const localX = pointerX - areaRect.left;
      const localY = pointerY - areaRect.top;

      const candidates = NO_POSITIONS.map((position) => {
        const rawX = position.x * areaRect.width - noRect.width / 2;
        const rawY = position.y * areaRect.height;
        const x = Math.max(minX, Math.min(maxX, rawX));
        const y = Math.max(minY, Math.min(maxY, rawY));
        const distanceToCursor = Math.hypot((x + noRect.width / 2) - localX, y - localY);
        return { x, y, distanceToCursor };
      }).sort((a, b) => b.distanceToCursor - a.distanceToCursor);

      const safestCandidates = candidates.slice(0, 3);
      const picked = safestCandidates[Math.floor(Math.random() * safestCandidates.length)] || candidates[0];

      noTargetX = picked.x + noRect.width / 2;
      noTargetY = picked.y;
    }

    function initNoButtonMotion() {
      // Només quan la pregunta es veu: si no, les mides són zero i el botó
      // començaria desplaçat. Es mesura des de la posició original del CSS.
      if (!questionReady) return;
      noBtn.style.left = "";
      noBtn.style.top = "";
      const areaRect = buttonArea.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();
      const startX = noRect.left - areaRect.left + noRect.width / 2;
      const startY = noRect.top - areaRect.top;

      noCurrentX = startX;
      noCurrentY = startY;
      noTargetX = startX;
      noTargetY = startY;
      noBtn.style.left = `${noCurrentX}px`;
      noBtn.style.top = `${noCurrentY}px`;
    }

    function animateNoButton() {
      if (noCurrentX !== null && noTargetX !== null) {
        noCurrentX += (noTargetX - noCurrentX) * 0.17;
        noCurrentY += (noTargetY - noCurrentY) * 0.17;
        noBtn.style.left = `${noCurrentX}px`;
        noBtn.style.top = `${noCurrentY}px`;
      }
      requestAnimationFrame(animateNoButton);
    }

    function pursuitNo(event) {
      if (transitioning) return;

      const rect = noBtn.getBoundingClientRect();
      const distance = Math.hypot(
        event.clientX - (rect.left + rect.width / 2),
        event.clientY - (rect.top + rect.height / 2)
      );

      if (distance < 105) {
        attemptedNo = true;
        moveNoButtonAggressively(event.clientX, event.clientY);
      }
    }

    function captureSceneCursor() {
      const sceneDoc = sceneFrame.contentWindow?.document;
      const sceneBody = sceneDoc?.body;
      if (!sceneBody?.requestPointerLock) return;

      const lockResult = sceneBody.requestPointerLock();
      if (lockResult?.catch) {
        lockResult.catch(() => {});
      }
    }

    // L'escena es comença a carregar quan la portada ja és a pantalla, i avisa
    // amb un missatge quan està a punt.
    let resolveWorld;
    const worldReady = new Promise((resolve) => (resolveWorld = resolve));
    window.addEventListener("message", (event) => {
      if (event.data && event.data.sceneReady) {
        worldLoaded = true;
        resolveWorld();
        // L'escena ja és a punt: ara sí, la pregunta (i ja no es penjarà res).
        revealQuestion();
        initNoButtonMotion();
      }
    });
    window.addEventListener("load", () => {
      setTimeout(() => {
        sceneFrame.src = "world/world.html";
      }, 150);
    });

    initNoButtonMotion();
    requestAnimationFrame(animateNoButton);

    document.addEventListener("mousemove", pursuitNo);
    window.addEventListener("resize", () => {
      initNoButtonMotion();
    });

    // Al mòbil no hi ha ratolí: el botó fuig quan el toques.
    noBtn.addEventListener("pointerdown", (event) => {
      if (transitioning) return;
      event.preventDefault();
      attemptedNo = true;
      moveNoButtonAggressively(event.clientX, event.clientY);
    });

    yesBtn.addEventListener("click", async () => {
      if (transitioning) return;

      if (!attemptedNo) {
        showNoHint();
        return;
      }

      transitioning = true;
      yesBtn.disabled = true;
      noBtn.disabled = true;

      if (!worldLoaded) {
        // Encara s'està carregant: "carregant records" fins que estigui a punt.
        questionWrap.classList.add("is-hidden");
        loadingGate.classList.remove("is-hidden");
        startChargingPoints();
        await worldReady;
        stopChargingPoints();
      } else {
        captureSceneCursor();
      }

      // Desperta l'escena (mentre era amagada no es dibuixava).
      sceneFrame.contentWindow?.postMessage({ sceneActive: true }, "*");
      message.textContent = "";

      await new Promise((resolve) => setTimeout(resolve, 520));

      fadeLayer.classList.add("is-visible");
      await new Promise((resolve) => setTimeout(resolve, 740));

      miniGame.classList.add("is-fading");
      sceneFrame.style.opacity = "1";

      // Ara sí: comença el so, just quan apareix l'escena.
      window.startAmbient?.();
      document.getElementById("sound-toggle").style.display = "block";

      await new Promise((resolve) => setTimeout(resolve, 320));
      fadeLayer.classList.remove("is-visible");
      miniGame.style.display = "none";
    });
  </script>
</body>
</html>
