<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>laurins</title>
  <link rel="icon" type="image/png" href="star.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/world.css">
  <style>
    body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
    #esc-hint {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      display: none;

      font-family: monospace;
      font-size: 14px;
      letter-spacing: 2px;

      color: rgba(255,255,255,0.6);

      pointer-events: none;

      animation: pulse 2s infinite;
    }

  @keyframes pulse {
    0%   { opacity: 0.3; }
    50%  { opacity: 0.8; }
    100% { opacity: 0.3; }
  }
  </style>
</head>
<body>
  <script type="module" src="main.js"></script>
  <div id="mood-vignette" aria-hidden="true"></div>
  <div id="mood-grain" aria-hidden="true"></div>
  <div id="esc-hint">ESC per alliberar el ratolí</div>
  <div id="click-star-hint" aria-hidden="true">mira l'estrella que brilla i fes clic</div>
  <div id="ending-overlay" aria-live="polite">
    <section class="ending-overlay__content">
      <h1 id="ending-title" class="ending-overlay__title"></h1>
      <p id="ending-text" class="ending-overlay__text"></p>
    </section>
  </div>
</body>
</html>
